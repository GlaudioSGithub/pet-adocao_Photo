<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"> <!-- Font Awesome -->
    <title>Adicionar Pet</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4"><i class="fas fa-plus-circle"></i> Adicionar Novo Pet</h1>
        <div class="card shadow p-4">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="nome" class="form-label"><i class="fas fa-dog"></i> Nome</label>
                    <input type="text" name="nome" id="nome" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="idade" class="form-label"><i class="fas fa-calendar-alt"></i> Idade</label>
                    <input type="number" name="idade" id="idade" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="raca" class="form-label"><i class="fas fa-paw"></i> Raça</label>
                    <input type="text" name="raca" id="raca" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label"><i class="fas fa-align-left"></i> Descrição</label>
                    <textarea name="descricao" id="descricao" class="form-control" rows="4" required></textarea>
                </div>
                <!-- Novo campo: Nome do responsável -->
                <div class="mb-3">
                    <label for="responsavel" class="form-label"><i class="fas fa-user"></i> Nome do Responsável</label>
                    <input type="text" name="responsavel" id="responsavel" class="form-control" placeholder="Ex: Maria Souza" required>
                </div>

                <!-- Novo campo: Contato -->
                <div class="mb-3">
                    <label for="contato" class="form-label"><i class="fas fa-phone"></i> Contato</label>
                    <input type="text" name="contato" id="contato" class="form-control" placeholder="(19) 98888-7777" required>
                </div>
                <!-- Exibir foto atual se houver -->
                {% if pet and pet[5] %}
                    <div class="mb-3">
                        <label class="form-label">Foto Atual</label><br>
                        <img src="{{ '/' + pet[5] }}" alt="Foto do pet" style="width: 150px; height: auto;">
                    </div>
                {% endif %}

                <!-- Campo de upload de foto -->
                <div class="mb-3">
                    <label for="foto" class="form-label"><i class="fas fa-image"></i> Foto do Pet</label>
                    <input type="file" name="foto" id="foto" class="form-control" accept="image/*">
                </div>
                
                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Adicionar Pet</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const telefone = document.getElementById("contato");

    telefone.addEventListener("input", function(e) {
        let valor = e.target.value.replace(/\D/g, "");
        if (valor.length > 11) valor = valor.slice(0, 11);

        if (valor.length > 6) {
            valor = valor.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, "($1) $2-$3");
        } else if (valor.length > 2) {
            valor = valor.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
        } else {
            valor = valor.replace(/^(\d*)/, "($1");
        }

        e.target.value = valor;
    });
});
</script>
