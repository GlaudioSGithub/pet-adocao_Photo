<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"> <!-- Font Awesome -->
    <title>Excluir Pet</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">
            <i class="fas fa-trash-alt"></i> Confirmar Exclusão
        </h1>
        <div class="alert alert-warning">
            <strong>Atenção!</strong> Você tem certeza que deseja excluir o pet <strong>{{ pet[1] }}</strong>?
        </div>
        <div class="d-flex justify-content-between">
            <a href="/listar" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
            <a href="/confirmar_exclusao/{{ pet[0] }}" class="btn btn-danger">
                <i class="fas fa-check"></i> Confirmar Exclusão
            </a>
        </div>
    </div>
</body>
</html>
