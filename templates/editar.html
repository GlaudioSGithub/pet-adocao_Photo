<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Editar Pet</title>

    <!-- Bootstrap e Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4"><i class="fas fa-edit"></i> Editar Pet</h1>
        <div class="card shadow p-4">
            <form method="POST" enctype="multipart/form-data">
                <div class="row">
                    <!-- Coluna Esquerda -->
                    <div class="col-md-8">
                        <!-- Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label"><i class="fas fa-dog"></i> Nome</label>
                            <input type="text" name="nome" id="nome" class="form-control" value="{{ pet[1] }}" required>
                        </div>

                        <!-- Idade -->
                        <div class="mb-3">
                            <label for="idade" class="form-label"><i class="fas fa-calendar-alt"></i> Idade</label>
                            <input type="number" name="idade" id="idade" class="form-control" value="{{ pet[2] }}" required>
                        </div>

                        <!-- Raça -->
                        <div class="mb-3">
                            <label for="raca" class="form-label"><i class="fas fa-paw"></i> Raça</label>
                            <input type="text" name="raca" id="raca" class="form-control" value="{{ pet[3] }}" required>
                        </div>
                    </div>

                    <!-- Coluna direita: Foto -->
                    <div class="col-md-4 d-flex flex-column align-items-center">
                        {% if pet[5] %}
                            <img src="{{ '/' + pet[5] }}" alt="Foto do Pet" 
                                 class="img-fluid rounded shadow-sm mb-3" 
                                 style="max-height: 200px; object-fit: cover;">
                        {% else %}
                            <div class="text-center text-muted border rounded p-4 mb-3 w-100">
                                <i class="fas fa-image fa-3x mb-2"></i><br>
                                Nenhuma foto cadastrada
                            </div>
                        {% endif %}

                        <!-- Botão de alterar foto -->
                        <label for="foto" class="btn btn-outline-primary w-100">
                            <i class="fas fa-camera"></i> Alterar Foto
                        </label>
                        <input type="file" name="foto" id="foto" class="form-control d-none" accept="image/*">
                    </div>
                </div>

                <hr>

                <!-- Descrição -->
                <div class="mb-3">
                    <label for="descricao" class="form-label"><i class="fas fa-align-left"></i> Descrição</label>
                    <textarea name="descricao" id="descricao" class="form-control" rows="4" required>{{ pet[4] }}</textarea>
                </div>

                <!-- Nome do Responsável -->
                <div class="mb-3">
                    <label for="responsavel" class="form-label"><i class="fas fa-user"></i> Nome do Responsável</label>
                    <input type="text" name="responsavel" id="responsavel" class="form-control"
                           value="{{ pet[6] if pet|length > 6 else '' }}" required>
                </div>

                <!-- Contato -->
                <div class="mb-3">
                    <label for="contato" class="form-label"><i class="fas fa-phone"></i> Contato</label>
                    <input type="text" name="contato" id="contato" class="form-control"
                           value="{{ pet[7] if pet|length > 7 else '' }}"
                           placeholder="(19) 98888-7777" required>
                </div>

                <!-- Botões -->
                <div class="d-flex justify-content-between">
                    <a href="/listar" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Máscara de telefone -->
    <script>
    document.getElementById('contato').addEventListener('input', function(e) {
        let x = e.target.value.replace(/\D/g, '').substring(0, 11);
        let ddd = x.substring(0, 2);
        let numero = x.substring(2, 7);
        let restante = x.substring(7, 11);

        if (x.length > 7) {
            e.target.value = `(${ddd}) ${numero}-${restante}`;
        } else if (x.length > 2) {
            e.target.value = `(${ddd}) ${numero}`;
        } else if (x.length > 0) {
            e.target.value = `(${ddd}`;
        }
    });
    </script>
</body>
</html>
