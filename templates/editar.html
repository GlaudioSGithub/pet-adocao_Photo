<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"> <!-- Font Awesome -->
    <title>Editar Pet</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">
            <i class="fas fa-edit text-primary"></i> Editar Informações do Pet
        </h1>
        <div class="card shadow p-4">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="nome" class="form-label">
                        <i class="fas fa-dog"></i> Nome
                    </label>
                    <input type="text" name="nome" id="nome" class="form-control" value="{{ pet[1] }}" required>
                </div>
                <div class="mb-3">
                    <label for="idade" class="form-label">
                        <i class="fas fa-calendar-alt"></i> Idade
                    </label>
                    <input type="number" name="idade" id="idade" class="form-control" value="{{ pet[2] }}" required>
                </div>
                <div class="mb-3">
                    <label for="raca" class="form-label">
                        <i class="fas fa-paw"></i> Raça
                    </label>
                    <input type="text" name="raca" id="raca" class="form-control" value="{{ pet[3] }}" required>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label">
                        <i class="fas fa-align-left"></i> Descrição
                    </label>
                    <textarea name="descricao" id="descricao" class="form-control" rows="4" required>{{ pet[4] }}</textarea>
                </div>
                
                <!-- Exibição e upload da foto -->
                <div class="mb-3">
                    <label for="foto" class="form-label">
                        <i class="fas fa-image"></i> Foto do Pet
                    </label>
                    <!-- Exibir foto atual se houver -->
                    {% if pet[6] %}
                        <div class="mb-2">
                            <img src="{{ url_for('static', filename='uploads/' + pet[6]) }}" alt="Foto de {{ pet[1] }}" class="img-thumbnail" style="width: 150px; height: auto;">
                        </div>
                        <p><small>Selecione uma nova foto para alterar a imagem.</small></p>
                    {% else %}
                        <p><small>Não há foto cadastrada. Selecione uma foto para o pet.</small></p>
                    {% endif %}
                    <input type="file" name="foto" id="foto" class="form-control" accept="image/*">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/listar" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
