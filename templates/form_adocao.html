<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"> <!-- Font Awesome -->
    <title>Formulário de Adoção</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">
            <i class="fas fa-paw"></i> Formulário de Adoção de Pet
        </h1>
        <div class="card shadow p-4">
            <h2 class="mt-4">Pet: {{ pet[1] }}</h2>
            <form method="POST" class="mt-4">
                <div class="mb-3">
                    <label for="nome_adotante" class="form-label">
                        <i class="fas fa-user"></i> Seu Nome
                    </label>
                    <input type="text" class="form-control" id="nome_adotante" name="nome_adotante" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <!-- Contato -->
                <div class="mb-3">
                    <label for="telefone" class="form-label"><i class="fas fa-phone"></i> Contato</label>
                    <input type="text" name="telefone" id="telefone" class="form-control"
                        value="{{ pet[7] if pet|length > 7 else '' }}"
                        placeholder="(19) 98888-7777" required>
                </div>
                <div class="mb-3">
                    <label for="mensagem" class="form-label">
                        <i class="fas fa-comment-alt"></i> Por que deseja adotar este pet?
                    </label>
                    <textarea class="form-control" id="mensagem" name="mensagem" rows="4" required></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/listar" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check"></i> Confirmar Adoção
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

<!-- Máscara de telefone -->  <!-- Validação e-mail -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const contato = document.getElementById('telefone');
    if (!contato) return;

    contato.addEventListener('input', function(e) {
        let x = e.target.value.replace(/\D/g, '').substring(0, 11);
        let ddd = x.substring(0, 2);
        let numero = x.substring(2, 7);
        let restante = x.substring(7, 11);

        if (x.length > 7) {
            e.target.value = `(${ddd}) ${numero}-${restante}`;
        } else if (x.length > 2) {
            e.target.value = `(${ddd}) ${numero}`;
        } else if (x.length > 0) {
            e.target.value = `(${ddd}`;
        }
    });
});


document.getElementById("email").addEventListener("input", function(e) {
    const email = e.target.value;
    const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
    if (!pattern.test(email)) {
        e.target.setCustomValidity("Por favor, insira um e-mail válido (ex: exemplo@dominio.com.br)");
    } else {
        e.target.setCustomValidity("");
    }
});
</script>
